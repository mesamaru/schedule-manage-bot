# fly.toml app configuration file for schedule-manage-bot
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# 注意:
#  - この Bot は HTTP サーバーを持たない常駐プロセスなので [http_service] は定義しない。
#    定義すると Fly が HTTP リクエスト有無でマシンを停止/起動しようとして常駐できなくなる。
#  - data/ には各サーバーの設定とメッセージIDが入る。ボリュームを外すと再起動のたびに
#    /setup 設定が消え、カレンダー/ステータスが重複投稿される。[[mounts]] は必須。

app = 'schedule-manage-bot'
primary_region = 'nrt'

[build]

[env]
  NODE_ENV = 'production'
  TZ = 'Asia/Tokyo'

[[mounts]]
  source = 'schedule_bot_data'
  destination = '/app/data'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
